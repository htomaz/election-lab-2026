name: Coleta experimental por zona EA20
on:
  workflow_dispatch:
    inputs:
      escopo:
        description: "UF em maiúsculas (ex.: SP) ou TODAS"
        required: true
        default: "TODAS"
        type: string
      limite:
        description: "Máximo de zonas consultadas (até 10000)"
        required: true
        default: "10000"
        type: string

# A exclusão por arquivo protege a execução local, mas cada runner
# do GitHub Actions tem um disco separado. Serializar execuções evita
# que duas rodadas restaurarem simultaneamente a mesma versão antiga
# e produzam dois caches incompatíveis do mesmo pleito.
concurrency:
  group: election-lab-zonal-6258-unico
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validar parâmetros
        shell: bash
        env:
          ESCOPO: ${{ inputs.escopo }}
          LIMITE: ${{ inputs.limite }}
        run: |
          python - <<'PY'
          import os
          from tse import UFS
          escopo=os.environ['ESCOPO'].upper()
          limite=os.environ['LIMITE']
          if escopo!='TODAS' and escopo not in UFS:
              raise SystemExit('UF inválida')
          if not limite.isdigit() or not 1<=int(limite)<=10000:
              raise SystemExit('Limite inválido')
          PY
      - name: Recuperar último snapshot zonal para coleta incremental
        uses: actions/cache/restore@v4
        with:
          path: dados_zonais_6258.json
          key: election-lab-6258-zonas-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            election-lab-6258-zonas-
      - name: Registrar situação do snapshot recuperado
        run: |
          python - <<'PY'
          from pathlib import Path
          from coletor_zonal import carregar_arquivo
          p=Path('dados_zonais_6258.json')
          if p.exists():
              d=carregar_arquivo(p)
              print('Zonas recuperadas:',len(d['observacoes']))
              print('Última gravação:',d.get('atualizado_em'))
          else:
              print('Sem cache anterior; iniciando coleta completa do escopo.')
          PY
      - name: Recuperar backup persistente da última coleta disponível
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ATUAL: ${{ github.run_id }}
        run: |
          python backup_actions.py --destino dados_zonais_6258.json --ignorar-run "$RUN_ATUAL"
      - name: Coletar EA16 e EA20 oficiais de todas as zonas selecionadas
        env:
          ESCOPO: ${{ inputs.escopo }}
          LIMITE: ${{ inputs.limite }}
        shell: bash
        run: |
          if [ "$ESCOPO" = "TODAS" ]; then
            python coletor_zonal.py --todas --limite "$LIMITE" --taxa 12 --concorrencia 8 --saida dados_zonais_6258.json
          else
            python coletor_zonal.py --uf "$ESCOPO" --limite "$LIMITE" --taxa 12 --concorrencia 8 --saida dados_zonais_6258.json
          fi
      - name: Preservar snapshot para próxima execução
        if: always() && hashFiles('dados_zonais_6258.json') != ''
        uses: actions/cache/save@v4
        with:
          path: dados_zonais_6258.json
          key: election-lab-6258-zonas-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Registrar manifesto SHA-256 do backup
        if: always() && hashFiles('dados_zonais_6258.json') != ''
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path('dados_zonais_6258.json')
          Path('snapshot.sha256').write_text(sha256(p.read_bytes()).hexdigest()+'\n',
                                              encoding='ascii')
          PY
      - name: Publicar snapshot para carregar no Streamlit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-zonal-6258
          path: |
            dados_zonais_6258.json
            snapshot.sha256
          if-no-files-found: warn
          retention-days: 30
