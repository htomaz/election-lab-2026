name: Validacao Election Lab
on:
  push:
    branches:
      - main
      - fix/auditoria-pre-segundo-turno
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar modulos Python
        run: python -m compileall -q .
      - name: Executar testes
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Auditar conciliacao dos historicos
        run: python validar_historicos.py --ufs historico_ufs.csv --zonas historico_zonas.csv
      - name: Reexecutar pseudo-backtest completo
        run: python backtest_comparativo.py --zonas historico_zonas.csv --saida /tmp/backtest_comparativo.csv
      - name: Conferir tamanho e convergencia do backtest
        run: |
          python - <<'PY'
          import csv
          with open('/tmp/backtest_comparativo.csv', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 416, f'Esperados 416 cenarios, encontrados {len(rows)}'
          assert all(abs(float(r['erro_pp'])) < 0.0001 for r in rows
                     if int(r['progresso_zonas_pct']) == 100), 'Falha de convergencia'
          print('Backtest valido:', len(rows), 'projecoes.')
          PY
      - name: Conferir formato EA20 publicado (1 zona de 2026T1)
        id: tse_ea20_remoto
        continue-on-error: true
        timeout-minutes: 2
        run: python teste_integracao_tse.py --turno 1
      - name: Validar nomes municipais contra EA12 oficial
        timeout-minutes: 2
        run: python teste_integracao_municipios.py
      - name: Conferir catálogo oficial de municípios e zonas do 1º turno
        timeout-minutes: 3
        run: python teste_catalogo_zonas_tse.py
      - name: Reconciliar comparecimento, abstenção e votos por zona
        run: python validar_participacao.py
      - name: Importar referência de comparecimento do primeiro turno de 2022
        timeout-minutes: 6
        run: python obter_participacao_tse.py --ano 2022 --turno 1
      - name: Exportar somente registros de 2022 primeiro turno
        run: |
          python - <<'PY'
          import csv
          with open('historico_participacao_zonas.csv',newline='',encoding='utf-8') as f:
              r=list(csv.DictReader(f))
          registros=[x for x in r if (x['ano'],x['turno'])==('2022','1')]
          print('TRANSICAO_COVERAGE:',len(registros))
          if len(registros)<6000:
              raise SystemExit('Histórico de 2022T1 incompleto')
          print('TRANSICAO_EXPORT_START')
          for row in registros:
              print('TRANSICAO_ROW:'+','.join(row[c] for c in (
                   'uf','municipio','zona','ano','turno','aptos','comparecimento',
                   'abstencoes','brancos','nulos','validos')))
          print('TRANSICAO_EXPORT_END')
          PY
