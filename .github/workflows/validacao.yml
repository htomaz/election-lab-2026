name: Validacao Election Lab
on:
  push:
    branches:
      - main
      - fix/auditoria-pre-segundo-turno
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar modulos Python
        run: python -m compileall -q .
      - name: Executar testes
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Auditar conciliacao dos historicos
        run: python validar_historicos.py --ufs historico_ufs.csv --zonas historico_zonas.csv
      - name: Reexecutar pseudo-backtest completo
        run: python backtest_comparativo.py --zonas historico_zonas.csv --saida /tmp/backtest_comparativo.csv
      - name: Conferir tamanho e convergencia do backtest
        run: |
          python - <<'PY'
          import csv
          with open('/tmp/backtest_comparativo.csv', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 416, f'Esperados 416 cenarios, encontrados {len(rows)}'
          assert all(abs(float(r['erro_pp'])) < 0.0001 for r in rows
                     if int(r['progresso_zonas_pct']) == 100), 'Falha de convergencia'
          print('Backtest valido:', len(rows), 'projecoes.')
          PY
      - name: Conferir formato EA20 publicado (1 zona de 2026T1)
        id: tse_ea20_remoto
        continue-on-error: true
        timeout-minutes: 2
        run: python teste_integracao_tse.py --turno 1
      - name: Validar nomes municipais contra EA12 oficial
        timeout-minutes: 2
        run: python teste_integracao_municipios.py
      - name: Conferir configuração pública EA11 sem consultar votos futuros
        timeout-minutes: 2
        run: python preflight_tse.py
      - name: Conferir catálogo oficial de municípios e zonas do 1º turno
        timeout-minutes: 3
        run: python teste_catalogo_zonas_tse.py
      - name: Pré-voo EA16 segundo turno (somente cadastro, sem votos)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          from preflight_ea16_segundo_turno import executar
          resultado=executar()
          print('Pré-voo EA16 segundo turno:',resultado)
          if resultado['status']!='ea16_3221_confere_primeiro_turno_na_uf':
              raise SystemExit('Cadastro EA16 ainda não confirmado nesta execução')
          PY
      - name: Reconciliar comparecimento, abstenção e votos por zona
        run: python validar_participacao.py
      - name: Backtest 2022 participação, abstenção, brancos e nulos
        timeout-minutes: 5
        run: |
          python backtest_participacao.py --saida /tmp/backtest_participacao.csv --resumo /tmp/resumo_participacao.csv
          python - <<'PY'
          import csv
          with open('/tmp/backtest_participacao.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==8*8*(1+6+6)*4, len(rows)
          assert all(abs(float(x['erro']))<0.01 for x in rows
                     if int(x['progresso_zonas_pct'])==100)
          print('Backtest participação:',len(rows),'previsões por variável')
          PY
      - name: Relatório retrospectivo de precisão por etapa e cenário
        run: |
          python relatorio_backtest_retro.py \
            --votos /tmp/backtest_comparativo.csv \
            --participacao /tmp/backtest_participacao.csv \
            --saida /tmp/relatorio_backtest_retro.csv
      - name: Calibrar intensidade com UFs de avaliação separadas
        timeout-minutes: 5
        run: |
          python calibrar_participacao.py --saida /tmp/calibracao_ufs.csv --resumo /tmp/resumo_calibracao.csv
          cat /tmp/resumo_calibracao.csv
      - name: Simular motor completo de 6.292 zonas de 0 a 100 por cento
        timeout-minutes: 3
        run: python simulacao_operacional.py
      - name: Ensaiar coleta incremental de 6.292 zonas sem rede
        timeout-minutes: 3
        run: python simulacao_coletor.py
      - name: Salvar diagnósticos retrospectivos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-zonais-retrospectivos
          path: |
            /tmp/backtest_participacao.csv
            /tmp/resumo_participacao.csv
            /tmp/relatorio_backtest_retro.csv
            /tmp/calibracao_ufs.csv
            /tmp/resumo_calibracao.csv
            /tmp/simulacao_operacional_zonas.csv
          if-no-files-found: warn
          retention-days: 15

  navegador:
    name: Navegador real - desktop e celular
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências e Chromium
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Subir Streamlit local somente para teste
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 \
             --server.address=127.0.0.1 > /tmp/streamlit-app.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo 'Streamlit respondeu ao health check'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit-app.log
          exit 1
      - name: Navegar pelas três abas e registrar capturas
        run: python visual_e2e.py
      - name: Publicar capturas desktop/mobile e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-desktop-mobile-auditoria
          path: |
            visual-auditoria/
            /tmp/streamlit-app.log
          retention-days: 30
          if-no-files-found: warn

  candidato:
    name: Preparar manifesto auditável, sem publicar
    needs: [testes, navegador]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/auditoria-pre-segundo-turno'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Manifesto da versão, bases e commit
        env:
          ELECTION_LAB_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python release_candidate.py
          python release_candidate.py --verificar
      - name: Entregar manifesto para revisão antes de merge
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-sha256
          path: release-candidate.json
          retention-days: 30
