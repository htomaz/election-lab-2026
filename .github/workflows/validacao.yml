name: Validacao Election Lab
on:
  push:
    branches:
      - main
      - fix/auditoria-pre-segundo-turno
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar modulos Python
        run: python -m compileall -q .
      - name: Executar testes
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Auditar conciliacao dos historicos
        run: python validar_historicos.py --ufs historico_ufs.csv --zonas historico_zonas.csv
      - name: Reexecutar pseudo-backtest completo
        run: python backtest_comparativo.py --zonas historico_zonas.csv --saida /tmp/backtest_comparativo.csv
      - name: Conferir tamanho e convergencia do backtest
        run: |
          python - <<'PY'
          import csv
          with open('/tmp/backtest_comparativo.csv', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 416, f'Esperados 416 cenarios, encontrados {len(rows)}'
          assert all(abs(float(r['erro_pp'])) < 0.0001 for r in rows
                     if int(r['progresso_zonas_pct']) == 100), 'Falha de convergencia'
          print('Backtest valido:', len(rows), 'projecoes.')
          PY
      - name: Conferir formato EA20 publicado (1 zona de 2026T1)
        id: tse_ea20_remoto
        continue-on-error: true
        timeout-minutes: 2
        run: python teste_integracao_tse.py --turno 1
      - name: Validar nomes municipais contra EA12 oficial
        timeout-minutes: 2
        run: python teste_integracao_municipios.py
      - name: Gerar snapshot pontual do cadastro EA12
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from municipios_tse import obter_municipios
          import csv
          import io
          mapa=obter_municipios()
          print('EA12_EXPORT_START')
          for (uf,codigo),nome in sorted(mapa.items()):
              buf=io.StringIO()
              csv.writer(buf,lineterminator='').writerow([uf,codigo,nome])
              print('EA12_ROW:'+buf.getvalue())
          print('EA12_EXPORT_END')
          PY
